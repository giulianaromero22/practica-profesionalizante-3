<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria y Suma</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <h1>¡Juego de Memoria y Suma!</h1>

    <div class="config">
        <label>Cantidad de números:</label>
        <input type="number" id="cantidad" value="4" min="1" max="5">

        <label> Tiempo (en segundos): </label>
        <input type="number" id="tiempo" value="1" min="1">
       
        <label>
             <input type="checkbox" id="negativos"> Permitir negativos
        </label>

        <br>
        <button id="botonIniciar">Iniciar</button>
    </div>

    <div id="numero"></div>

    <div class="respuesta">
        <input type="number" id="respuesta" placeholder="Ingresa la suma">
        <button id="botonVerificar">Confirmar</button>
    </div>

    <div id="resultado"></div>

    <script src="script.js" defer></script>
</body>
</html>
